    <title>Zahnwelten – Digitaler Praxisassistent</title>


    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 90%;
            max-width: 640px;
            padding: 50px 40px;
            background: #ffffff;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.10);
            text-align: center;
        }

        .logo {
            margin-bottom: 35px;
        }

        .logo img {
            max-width: 100%;
            height: auto;
            width: 150px;
            display: block;
            margin: 0 auto;
        }

        h1 {
            font-size: 27px;
            color: #13adbf;
            margin: 0 0 18px;
            font-weight: 700;
        }

        p {
            font-size: 17px;
            line-height: 1.6;
            color: #666;
            margin: 0;
        }

        .hint {
            margin-top: 28px;
            font-size: 15px;
            color: #888;
        }

        @media (max-width: 600px) {
            .container {
                padding: 40px 25px;
            }

            h1 {
                font-size: 24px;
            }

            p {
                font-size: 16px;
            }

            .logo img {
                width: 130px;
            }
        }
    </style>
</head>
